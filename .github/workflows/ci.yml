name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src\SideDock\SideDock.csproj

      - name: Build
        run: dotnet build src\SideDock\SideDock.csproj --configuration Release --no-restore

      - name: Build MSI
        shell: cmd
        run: scripts\Build-Installer.cmd

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-msi
          path: artifacts\installer\*.msi
          if-no-files-found: error
